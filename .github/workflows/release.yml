name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verificar que el tag coincida con la versión del plugin
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          RELEASE=$(grep -oP '\$plugin->release\s*=\s*[\x27"]\K[^\x27"]+' src/version.php || true)
          if [ -z "$RELEASE" ]; then
            echo "::error::No se encontró \$plugin->release en src/version.php"
            exit 1
          fi
          if [ "$TAG" != "$RELEASE" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con \$plugin->release ($RELEASE) de src/version.php"
            exit 1
          fi
          echo "El tag $GITHUB_REF_NAME coincide con \$plugin->release $RELEASE"

      - name: Preparar paquetes
        run: |
          mkdir -p package/chuspasocial
          cp -r src/. package/chuspasocial/

      - name: Crear ZIP
        run: |
          cd package
          zip -r ../local_chuspasocial.zip chuspasocial

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: local_chuspasocial.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: local_chuspasocial
          path: local_chuspasocial.zip